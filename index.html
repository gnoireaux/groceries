<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12160f" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#eef1ea" media="(prefers-color-scheme:light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Groceries</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface-2:#f5f8f1; --surface-3:#eaefe4;
    --ink:#1b241e; --ink-soft:#5c6b60; --ink-faint:#8a978c;
    --line:#dde3d6; --line-strong:#cbd4c2;
    --accent:#35734f; --accent-ink:#ffffff; --accent-soft:#e4efe6;
    --good:#35734f; --warn:#c58a1f; --over:#c14a37;
    --shadow:0 1px 2px rgba(27,36,30,.05),0 8px 24px -12px rgba(27,36,30,.18);
    --shadow-pop:0 12px 34px -8px rgba(27,36,30,.30);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#12160f; --surface:#1b211a; --surface-2:#222a20; --surface-3:#2a3327;
      --ink:#e9ede4; --ink-soft:#9caa9c; --ink-faint:#788474;
      --line:#313a2e; --line-strong:#3d4838;
      --accent:#6cc38b; --accent-ink:#0e2116; --accent-soft:#213026;
      --good:#6cc38b; --warn:#e0aa4a; --over:#e58063;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
      --shadow-pop:0 14px 40px -10px rgba(0,0,0,.75);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160f; --surface:#1b211a; --surface-2:#222a20; --surface-3:#2a3327;
    --ink:#e9ede4; --ink-soft:#9caa9c; --ink-faint:#788474;
    --line:#313a2e; --line-strong:#3d4838;
    --accent:#6cc38b; --accent-ink:#0e2116; --accent-soft:#213026;
    --good:#6cc38b; --warn:#e0aa4a; --over:#e58063;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
    --shadow-pop:0 14px 40px -10px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    line-height:1.4; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer; color:inherit}
  input{font-family:inherit}

  /* ---- sticky top ---- */
  .top{position:sticky; top:0; z-index:20; background:var(--bg);
    padding:14px 16px 8px; border-bottom:1px solid transparent; transition:border-color .2s;}
  .top.stuck{border-color:var(--line)}

  .brandrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand .mark{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:1.05rem; letter-spacing:-.01em;}
  .brand .sub{font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-faint);}
  .icnbtn{width:36px; height:36px; border:1px solid var(--line); background:var(--surface);
    border-radius:11px; display:grid; place-items:center; font-size:1rem;}
  .icnbtn:active{transform:scale(.94)}

  /* ---- budget card ---- */
  .budget{background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:16px 18px 18px; box-shadow:var(--shadow);}
  .segrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .seg{display:inline-flex; background:var(--surface-3); border-radius:12px; padding:3px; gap:2px;}
  .seg button{border:0; background:transparent; padding:7px 13px; border-radius:9px;
    font-size:.82rem; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .capsel{font-size:.72rem; color:var(--ink-faint); text-align:right; line-height:1.3;}
  .capsel b{display:block; color:var(--ink-soft); font-size:.78rem;}

  .totalline{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .total{font-family:'Fraunces',Georgia,serif; font-weight:600; letter-spacing:-.02em;
    font-size:clamp(2.6rem,13vw,3.4rem); line-height:.95; font-variant-numeric:tabular-nums;}
  .total.over{color:var(--over)}
  .caplabel{font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint); margin-bottom:6px;}
  .goalbtn{text-align:right; background:transparent; border:0; padding:2px 0;}
  .goalbtn .k{font-size:.66rem; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint);}
  .goalbtn .v{font-size:.98rem; font-weight:600; font-variant-numeric:tabular-nums; border-bottom:1px dashed var(--line-strong);}

  .bar{position:relative; height:12px; background:var(--surface-3); border-radius:99px; margin-top:14px; overflow:hidden;}
  .bar .fill{position:absolute; left:0; top:0; bottom:0; border-radius:99px;
    background:var(--accent); transition:width .35s cubic-bezier(.4,0,.2,1),background .3s; min-width:0;}
  .bar.over .fill{background:var(--over)}
  .goaltick{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-faint); opacity:.5; border-radius:2px;}
  .remain{margin-top:9px; font-size:.86rem; font-weight:500; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .remain .dot{width:7px; height:7px; border-radius:99px; background:var(--good)}
  .remain.over{color:var(--over)} .remain.over .dot{background:var(--over)}

  /* ---- search ---- */
  .searchwrap{position:relative; margin-top:12px;}
  .searchbox{display:flex; align-items:center; gap:9px; background:var(--surface);
    border:1px solid var(--line-strong); border-radius:14px; padding:0 12px; box-shadow:var(--shadow);
    transition:border-color .15s, box-shadow .15s;}
  .searchbox:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .searchbox svg{width:18px; height:18px; flex:none; color:var(--ink-faint)}
  .searchbox input{flex:1; border:0; outline:0; background:transparent; color:var(--ink);
    font-size:1rem; padding:13px 0;}
  .searchbox .clr{border:0; background:transparent; color:var(--ink-faint); font-size:1.3rem; padding:4px 2px; display:none;}
  .searchbox.has .clr{display:block}

  .results{position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:30;
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-pop); max-height:min(52dvh,420px); overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; display:none;}
  .results.show{display:block}
  .res{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0;
    background:transparent; padding:12px 14px; border-bottom:1px solid var(--line);}
  .res:last-child{border-bottom:0}
  .res:active{background:var(--surface-2)}
  .res .nm{flex:1; min-width:0}
  .res .nm .t{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .res .nm .note{font-size:.74rem; color:var(--ink-faint)}
  .res .pr{font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:.92rem;}
  .res .pr.none{color:var(--warn); font-weight:500}
  .res .inbag{font-size:.72rem; color:var(--accent); font-weight:600; background:var(--accent-soft); padding:2px 7px; border-radius:99px;}

  .res.create{background:var(--surface-2)}
  .res.create .plus{width:26px; height:26px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
    display:grid; place-items:center; font-size:1.1rem; font-weight:700; flex:none;}
  .res.create .mk{flex:1; font-weight:600}
  .res.create .mk small{display:block; font-weight:400; color:var(--ink-faint); font-size:.72rem}
  .pricemini{display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--line-strong);
    border-radius:9px; padding:0 8px; width:92px;}
  .pricemini input{width:100%; border:0; outline:0; background:transparent; color:var(--ink);
    font-size:.95rem; padding:8px 0; text-align:right; font-variant-numeric:tabular-nums;}
  .pricemini .eur{color:var(--ink-faint); font-size:.85rem}

  /* ---- list ---- */
  .list{flex:1; padding:6px 16px 30px;}
  .empty{text-align:center; color:var(--ink-faint); padding:52px 20px;}
  .empty .big{font-family:'Fraunces',Georgia,serif; font-size:1.3rem; color:var(--ink-soft); margin-bottom:6px;}
  .empty .em{font-size:2rem; margin-bottom:10px}

  .grouphd{font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint);
    padding:16px 4px 8px; display:flex; justify-content:space-between; align-items:baseline;}
  .grouphd .cnt{font-variant-numeric:tabular-nums}

  .row{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line);
    border-radius:15px; padding:11px 12px; margin-bottom:9px; box-shadow:var(--shadow);}
  .row.checked{background:var(--surface-2)}
  .check{width:27px; height:27px; border-radius:99px; border:2px solid var(--line-strong); flex:none;
    background:transparent; display:grid; place-items:center; color:var(--accent-ink); transition:.15s;}
  .row.checked .check{background:var(--accent); border-color:var(--accent);}
  .check svg{width:15px; height:15px; opacity:0; transition:opacity .15s}
  .row.checked .check svg{opacity:1}
  body.maison .check{display:none}

  .rname{flex:1; min-width:0}
  .rname .t{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row.checked .rname .t{color:var(--ink-soft)}
  .rname .meta{font-size:.75rem; color:var(--ink-faint); display:flex; gap:7px; align-items:center;}
  .rname .meta .unit{border-bottom:1px dashed var(--line-strong)}
  .rname .meta .unit.none{color:var(--warn); border-color:var(--warn)}

  .stepper{display:flex; align-items:center; gap:0; background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; flex:none;}
  .stepper button{width:32px; height:34px; border:0; background:transparent; font-size:1.15rem; color:var(--ink-soft);
    display:grid; place-items:center;}
  .stepper button:active{color:var(--accent)}
  .stepper .q{min-width:30px; text-align:center; font-weight:600; font-size:.9rem; font-variant-numeric:tabular-nums;
    border:0; background:transparent; color:var(--ink); padding:0;}
  .rtot{min-width:62px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; flex:none;}
  .rdel{border:0; background:transparent; color:var(--ink-faint); font-size:1.15rem; padding:2px 2px 2px 4px; flex:none;}
  .rdel:active{color:var(--over)}

  .foot{display:flex; gap:8px; padding:6px 4px 20px; flex-wrap:wrap;}
  .foot button{flex:1; border:1px solid var(--line); background:var(--surface); border-radius:11px;
    padding:11px; font-size:.82rem; font-weight:600; color:var(--ink-soft); min-width:120px;}
  .foot button:active{background:var(--surface-2)}
  .foot button.danger:active{color:var(--over); border-color:var(--over)}

  .inlineprice{display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--accent);
    border-radius:8px; padding:0 7px; box-shadow:0 0 0 3px var(--accent-soft);}
  .inlineprice input{width:66px; border:0; outline:0; background:transparent; color:var(--ink);
    text-align:right; font-size:.9rem; padding:6px 0; font-variant-numeric:tabular-nums;}

  /* ---- unit chip (pièce / kg) ---- */
  .unitchip{border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-soft);
    font-size:.68rem; font-weight:600; padding:2px 7px; border-radius:99px; margin-left:2px;
    text-transform:uppercase; letter-spacing:.04em;}
  .unitchip.kg{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .unitchip:active{transform:scale(.94)}

  /* ---- browse / results sections ---- */
  .res-hd{position:sticky; top:0; z-index:1; background:var(--surface-2); color:var(--ink-faint);
    font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700;
    padding:7px 14px; border-bottom:1px solid var(--line);}
  .res-hd.fav{color:var(--accent)}
  .res .uses{font-size:.68rem; color:var(--ink-faint); background:var(--surface-3); padding:1px 6px; border-radius:99px;}

  /* ---- tools row (export/import) ---- */
  .tools{display:flex; gap:8px; padding:2px 4px 24px; flex-wrap:wrap;}
  .tools button{flex:1; border:1px solid var(--line); background:transparent; border-radius:11px;
    padding:10px; font-size:.78rem; font-weight:600; color:var(--ink-faint); min-width:100px;}
  .tools button:active{background:var(--surface-2); color:var(--ink-soft)}

  /* ---- always-present catalog panel (tap to add) ---- */
  .catpanel{margin-top:8px; border-top:1px solid var(--line); padding-top:12px;}
  .catpanel-hd{font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint);
    padding:2px 4px 10px; display:flex; justify-content:space-between; align-items:baseline;}
  .catpanel-hd .cnt{font-variant-numeric:tabular-nums; background:var(--surface-3); color:var(--ink-soft);
    padding:1px 8px; border-radius:99px; font-size:.72rem;}
  .catgrid{display:flex; flex-wrap:wrap; gap:7px;}
  .catchip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); border-radius:99px; padding:9px 13px;
    font-size:.86rem; font-weight:500; max-width:100%; box-shadow:var(--shadow);}
  .catchip .cn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .catchip:active{background:var(--surface-2); transform:scale(.97);}
  .catchip.in{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .catchip .cq{font-size:.72rem; font-weight:700; font-variant-numeric:tabular-nums;}
  .catchip .cu{font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--accent); background:var(--accent-soft); border-radius:99px; padding:1px 5px;}

  .catpanel-hd .cfgbtn{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    font-size:.72rem; font-weight:600; padding:5px 11px; border-radius:99px;}
  .catpanel-hd .cfgbtn:active{background:var(--surface-2)}
  .cattier-hd{font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--ink-faint);
    padding:14px 4px 8px; display:flex; justify-content:space-between; align-items:baseline;}
  .cattier-hd .cnt{font-variant-numeric:tabular-nums; color:var(--ink-faint); font-weight:600;}
  .cattier-hd.tier-fav{color:var(--accent)} .cattier-hd.tier-fav .cnt{color:var(--accent)}
  .cattier-hd.tier-low{opacity:.75}
  .catchip.t-low{opacity:.66; box-shadow:none; background:var(--surface-2);}
  .catchip.t-fav{border-color:var(--line-strong)}

  /* ---- config page ---- */
  .cfg-ov{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
    overscroll-behavior:contain;}
  .cfg-top{position:sticky; top:0; display:flex; align-items:center; gap:8px; padding:12px 14px;
    background:var(--bg); border-bottom:1px solid var(--line);}
  .cfg-title{flex:1; text-align:center; font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:1rem;}
  .cfg-close,.cfg-add{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    font-size:.82rem; font-weight:600; padding:8px 12px; border-radius:11px;}
  .cfg-add{color:var(--accent); border-color:var(--accent); background:var(--accent-soft);}
  .cfg-close:active,.cfg-add:active{transform:scale(.96)}
  .cfg-hint{font-size:.78rem; color:var(--ink-faint); padding:12px 16px 4px; line-height:1.4;}
  .cfg-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 14px calc(30px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; width:100%;}
  .cfg-tierhd{font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--ink-faint);
    padding:16px 2px 8px; display:flex; justify-content:space-between; align-items:baseline; position:sticky; top:0;
    background:var(--bg); z-index:1;}
  .cfg-tierhd.tier-fav{color:var(--accent)}
  .cfg-tierhd .cnt{font-variant-numeric:tabular-nums}
  .cfg-emptytier{color:var(--ink-faint); padding:2px 4px 6px; font-size:.9rem;}
  .cfg-row{display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:9px 10px; margin-bottom:8px; box-shadow:var(--shadow);}
  .cfg-rank{display:flex; flex-direction:column; gap:3px; flex:none;}
  .cfg-rank button{width:34px; height:26px; border:1px solid var(--line); background:var(--surface-2); border-radius:8px;
    font-size:.85rem; color:var(--ink-soft); display:grid; place-items:center;}
  .cfg-rank button:active:not(:disabled){color:var(--accent); border-color:var(--accent)}
  .cfg-rank button:disabled{opacity:.3}
  .cfg-mid{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .cfg-name{border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); border-radius:9px;
    padding:8px 10px; font-size:.95rem; font-weight:500; width:100%;}
  .cfg-name:focus{outline:0; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .cfg-sub{display:flex; align-items:center; gap:6px;}
  .cfg-price{width:76px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
    border-radius:9px; padding:7px 9px; text-align:right; font-size:.9rem; font-variant-numeric:tabular-nums;}
  .cfg-price:focus{outline:0; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .cfg-eur{color:var(--ink-faint); font-size:.85rem; margin-right:2px;}
  .cfg-unit{border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-soft);
    font-size:.72rem; font-weight:600; padding:6px 11px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em;}
  .cfg-unit.kg{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .cfg-del{border:0; background:transparent; font-size:1.1rem; padding:6px 4px; flex:none; align-self:center; opacity:.7;}
  .cfg-del:active{opacity:1; transform:scale(.9)}
  .cfg-ver{flex:none; text-align:center; font-size:.68rem; color:var(--ink-faint);
    font-variant-numeric:tabular-nums; padding:8px 14px calc(12px + env(safe-area-inset-bottom));}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>

<div class="wrap">
  <div class="top" id="top">
    <div class="brandrow">
      <div class="brand">
        <span class="mark">Courses</span>
        <span class="sub">Ticket Resto</span>
      </div>
      <button class="icnbtn" id="theme" aria-label="Thème">◐</button>
    </div>

    <div class="budget">
      <div class="segrow">
        <div class="seg" role="tablist">
          <button id="mMaison" class="on" role="tab">🏠 Maison</button>
          <button id="mMagasin" role="tab">🛒 Magasin</button>
        </div>
        <div class="capsel" id="capsel"></div>
      </div>

      <div class="totalline">
        <div>
          <div class="caplabel" id="totLabel">Total de la liste</div>
          <div class="total tnum" id="total">0,00 €</div>
        </div>
        <button class="goalbtn" id="goalBtn">
          <span class="k">Plafond / jour</span><br>
          <span class="v tnum" id="goalVal">25,00 €</span>
        </button>
      </div>

      <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="goaltick" id="tick" style="left:100%"></div></div>
      <div class="remain" id="remain"><span class="dot"></span><span id="remainTxt"></span></div>

      <div class="searchwrap">
        <div class="searchbox" id="sbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="search" type="text" inputmode="search" enterkeyhint="done" autocomplete="off"
            placeholder="Rechercher ou créer un article…" aria-label="Rechercher ou créer">
          <button class="clr" id="clr" aria-label="Effacer">×</button>
        </div>
        <div class="results" id="results"></div>
      </div>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const APP_VERSION='2026-08-29 20:05';   // build stamp — bump on each deploy so phone can confirm it loaded latest
const SEED=[
{n:'carottes',p:1.49,note:'sachet'},
{n:'oranges table',p:2.79,note:''},

const LS='courses_v2';
const eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=v=>eur.format(v||0);
const norm=s=>(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().trim();
const parseNum=s=>{const v=parseFloat(String(s).replace(',','.').replace(/[^0-9.]/g,''));return isNaN(v)?null:v;};

/* ---------- tiers (Fréquents / Autres / Rangés) — defined before load() (dedup uses tierRank) ---------- */
const TIERS=['fav','mid','low'];                 // order = prominence, top→bottom in panel
const TIER_LABEL={fav:'Fréquents',mid:'Autres',low:'Rangés'};
const tierRank=t=>{const i=TIERS.indexOf(t); return i<0?1:i;};   // unknown → mid
function moveTier(cat,dir){                        // dir −1 promote, +1 demote
  const i=Math.min(TIERS.length-1,Math.max(0,tierRank(cat.tier)+dir));
  cat.tier=TIERS[i]; save();
}

let S=load();

function load(){
  try{const j=JSON.parse(localStorage.getItem(LS)); if(j&&j.catalog) return migrate(j);}catch(e){}
  let id=1;
  return {catalog:SEED.map(s=>({id:id++,n:s.n,p:s.p,note:s.note,unit:'pce',uses:0,last:0,tier:'mid'})),
          list:[], target:25, mode:'maison', nextId:id, theme:null};
}
// backfill fields added after a state was first saved
function migrate(j){
  j.catalog.forEach(c=>{ if(!c.unit) c.unit='pce'; if(c.uses==null) c.uses=0; if(c.last==null) c.last=0;
    if(!c.tier) c.tier=(c.uses>0?'fav':'mid'); });   // seed Fréquents from prior use
  j.list.forEach(l=>{ if(!l.unit) l.unit='pce'; });
  return dedupCatalog(j);
}
// collapse catalog entries sharing a normalized name (merge uses/price/unit, repoint list refs)
function dedupCatalog(j){
  const byNorm=new Map(), remap=new Map(), kept=[];
  for(const c of j.catalog){
    const key=norm(c.n), s=byNorm.get(key);
    if(s){
      s.uses=(s.uses||0)+(c.uses||0);
      s.last=Math.max(s.last||0,c.last||0);
      if(s.p==null && c.p!=null) s.p=c.p;
      if(!s.note && c.note) s.note=c.note;
      if(s.unit!=='kg' && c.unit==='kg') s.unit='kg';
      if(tierRank(c.tier)<tierRank(s.tier)) s.tier=c.tier;   // keep most-prominent tier
      remap.set(c.id,s.id);
    } else { byNorm.set(key,c); kept.push(c); }
  }
  j.catalog=kept;
  const byCat=new Map(), lines=[];
  for(const l of j.list){
    if(remap.has(l.catId)) l.catId=remap.get(l.catId);
    const prev=(l.catId!=null)?byCat.get(l.catId):null;
    if(prev){ prev.qty=round((prev.qty||0)+(l.qty||0)); prev.checked=prev.checked||l.checked; }
    else { if(l.catId!=null) byCat.set(l.catId,l); lines.push(l); }
  }
  j.list=lines;
  return j;
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} try{syncOnSave();}catch(e){}}
function newId(){return S.nextId++;}

/* ---------- totals ---------- */
const lineTotal=l=>(l.p||0)*(l.qty||0);
const isKg=x=>x&&x.unit==='kg';
const stepOf=l=>isKg(l)?0.1:1;        // kg → 100g steps, else whole units
const minQty=l=>isKg(l)?0.1:1;
const sumAll=()=>S.list.reduce((a,l)=>a+lineTotal(l),0);
const sumChecked=()=>S.list.filter(l=>l.checked).reduce((a,l)=>a+lineTotal(l),0);

/* ---------- render header ---------- */
function renderHeader(){
  const magasin=S.mode==='magasin';
  document.body.classList.toggle('maison',!magasin);
  $('mMaison').classList.toggle('on',!magasin);
  $('mMagasin').classList.toggle('on',magasin);

  const hero=magasin?sumChecked():sumAll();
  const t=S.target||0;
  $('total').textContent=fmt(hero);
  $('total').classList.toggle('over',hero>t+1e-9);
  $('totLabel').textContent=magasin?'Dans le panier':'Total de la liste';
  $('goalVal').textContent=fmt(t);

  // secondary caption
  if(magasin){
    const all=sumAll(), left=S.list.filter(l=>!l.checked).length;
    $('capsel').innerHTML=`<b>Liste : ${fmt(all)}</b>${left} à prendre`;
  }else{
    const n=S.list.length;
    $('capsel').innerHTML=`<b>${n} article${n>1?'s':''}</b>sur la liste`;
  }

  const pct=t>0?hero/t:0;
  const fill=$('fill'), bar=$('bar');
  fill.style.width=Math.min(pct,1)*100+'%';
  bar.classList.toggle('over',hero>t+1e-9);
  const over=hero-t;
  const rem=$('remain'), rt=$('remainTxt');
  if(over>1e-9){rem.classList.add('over'); rt.textContent='Dépassement '+fmt(over);}
  else{rem.classList.remove('over');
    rt.textContent=(t-hero<1e-9?'Pile au plafond':'Reste '+fmt(t-hero)+' avant le plafond');}
}

const checkSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>';

function renderList(){
  list.innerHTML='';
  if(!S.list.length){
    list.innerHTML=`<div class="empty"><div class="em">🥕</div><div class="big">Liste vide</div>
      <div>Cherche un article ci-dessus pour l’ajouter.<br>Pas dans la liste ? Tape son nom pour le créer.</div></div>`;
    renderFoot(); renderTools(); renderCatalogPanel(); return;
  }
  const magasin=S.mode==='magasin';
  const frag=document.createDocumentFragment();

  if(magasin){
    const todo=S.list.filter(l=>!l.checked), done=S.list.filter(l=>l.checked);
    if(todo.length){frag.appendChild(groupHead('À prendre',todo.length)); todo.forEach(l=>frag.appendChild(rowEl(l)));}
    if(done.length){frag.appendChild(groupHead('Dans le panier',done.length,fmt(sumChecked()))); done.forEach(l=>frag.appendChild(rowEl(l)));}
  }else{
    S.list.forEach(l=>frag.appendChild(rowEl(l)));
  }
  list.appendChild(frag);
  renderFoot(); renderTools(); renderCatalogPanel();
}
function groupHead(txt,cnt,extra){
  const d=document.createElement('div'); d.className='grouphd';
  d.innerHTML=`<span>${txt}</span><span class="cnt">${extra?extra+' · ':''}${cnt}</span>`; return d;
}
function rowEl(l){
  const row=document.createElement('div');
  row.className='row'+(l.checked?' checked':'');
  const noPrice=(l.p==null);

  const check=document.createElement('button');
  check.className='check'; check.setAttribute('aria-label','Dans le panier'); check.innerHTML=checkSVG;
  check.onclick=()=>{l.checked=!l.checked; save(); render();};

  const nm=document.createElement('div'); nm.className='rname';
  const unitCls='unit'+(noPrice?' none':'');
  const priceTxt=noPrice?'prix ?':(fmt(l.p)+(isKg(l)?'/kg':''));
  nm.innerHTML=`<div class="t">${esc(l.n)}</div>
    <div class="meta"><span class="${unitCls}" data-price>${priceTxt}</span>
    <button class="unitchip${isKg(l)?' kg':''}" data-unit>${isKg(l)?'kg':'pièce'}</button>
    ${l.note?'<span>'+esc(l.note)+'</span>':''}</div>`;
  nm.querySelector('[data-price]').onclick=(e)=>{e.stopPropagation(); editPrice(l,nm.querySelector('[data-price]'));};
  nm.querySelector('[data-unit]').onclick=(e)=>{e.stopPropagation(); toggleUnit(l);};
  if(S.mode==='magasin') nm.onclick=()=>{l.checked=!l.checked; save(); render();};

  const step=document.createElement('div'); step.className='stepper';
  const st=stepOf(l);
  const minus=document.createElement('button'); minus.textContent='−'; minus.setAttribute('aria-label','Moins');
  minus.onclick=()=>{ if(l.qty<=minQty(l)+1e-9){removeLine(l);} else {l.qty=round(l.qty-st);} save(); render(); };
  const q=document.createElement('button'); q.className='q'; q.textContent=fmtQty(l.qty)+(isKg(l)?' kg':'');
  q.onclick=()=>editQty(l,q);
  const plus=document.createElement('button'); plus.textContent='+'; plus.setAttribute('aria-label','Plus');
  plus.onclick=()=>{l.qty=round((l.qty||0)+st); save(); render();};
  step.append(minus,q,plus);

  const tot=document.createElement('div'); tot.className='rtot'; tot.textContent=noPrice?'—':fmt(lineTotal(l));
  const del=document.createElement('button'); del.className='rdel'; del.innerHTML='×'; del.setAttribute('aria-label','Retirer');
  del.onclick=()=>{removeLine(l); save(); render();};

  row.append(check,nm,step,tot,del);
  return row;
}
function renderFoot(){
  let foot=document.querySelector('.foot'); if(foot) foot.remove();
  if(!S.list.length) return;
  foot=document.createElement('div'); foot.className='foot';
  if(S.mode==='magasin'){

// always-present bottom panel: catalog in 3 tiers (Fréquents / Autres / Rangés),
// A–Z within each, tap to add/increment. Ranking is managed on the config page.
function renderCatalogPanel(){
  let p=document.querySelector('.catpanel'); if(p) p.remove();
  if(!S.catalog.length) return;
  p=document.createElement('div'); p.className='catpanel';
  const hd=document.createElement('div'); hd.className='catpanel-hd';
  hd.innerHTML=`<span>Catalogue</span>`
    +`<button class="cfgbtn" id="openCfg" aria-label="Gérer les articles">⚙ Gérer</button>`;
  p.appendChild(hd);

  for(const tier of TIERS){
    const items=S.catalog.filter(c=>tierRank(c.tier)===tierRank(tier))
      .sort((a,b)=>norm(a.n).localeCompare(norm(b.n),'fr'));
    if(!items.length) continue;
    const th=document.createElement('div'); th.className='cattier-hd tier-'+tier;
    th.innerHTML=`<span>${TIER_LABEL[tier]}</span><span class="cnt">${items.length}</span>`;
    p.appendChild(th);
    const grid=document.createElement('div'); grid.className='catgrid';
    for(const c of items){
      const inList=S.list.find(l=>l.catId===c.id);
      const b=document.createElement('button'); b.type='button';
      b.className='catchip'+(inList?' in':'')+' t-'+tier;
      b.innerHTML=`<span class="cn">${esc(c.n)}</span>`
        +(c.unit==='kg'?'<span class="cu">kg</span>':'')
        +(inList?`<span class="cq">×${fmtQty(inList.qty)}</span>`:'');
      b.onclick=()=>{ addToList(c); render(); };
      grid.appendChild(b);
    }
    p.appendChild(grid);
  }
  p.querySelector('#openCfg').onclick=openConfig;
  list.appendChild(p);
}

function openConfig(){

function closeConfig(){ const ov=$('cfgOv'); if(ov) ov.remove(); document.body.style.overflow=''; render(); }
function renderConfigBody(){
  const body=$('cfgBody'); if(!body) return;
  body.innerHTML='';
  for(const tier of TIERS){
    const items=S.catalog.filter(c=>tierRank(c.tier)===tierRank(tier))
      .sort((a,b)=>norm(a.n).localeCompare(norm(b.n),'fr'));

function cfgRow(c,tier){
  const row=document.createElement('div'); row.className='cfg-row';
  const rank=tierRank(tier);
  // rank controls
  const rk=document.createElement('div'); rk.className='cfg-rank';
  const up=document.createElement('button'); up.textContent='⬆'; up.setAttribute('aria-label','Promouvoir'); up.disabled=(rank===0);
  up.onclick=()=>{ moveTier(c,-1); renderConfigBody(); };
  const dn=document.createElement('button'); dn.textContent='⬇'; dn.setAttribute('aria-label','Rétrograder'); dn.disabled=(rank===TIERS.length-1);
  dn.onclick=()=>{ moveTier(c,+1); renderConfigBody(); };
  rk.append(up,dn);
  // name + price/unit
  const mid=document.createElement('div'); mid.className='cfg-mid';
  const name=document.createElement('input'); name.className='cfg-name'; name.type='text'; name.value=c.n; name.placeholder='Nom de l’article';
  name.onchange=()=>{ c.n=name.value.trim(); const l=S.list.find(x=>x.catId===c.id); if(l) l.n=c.n; save(); };
  const sub=document.createElement('div'); sub.className='cfg-sub';
  const price=document.createElement('input'); price.className='cfg-price'; price.type='text'; price.inputMode='decimal';
  price.value=c.p==null?'':String(c.p).replace('.',','); price.placeholder='prix';
  price.onchange=()=>{ const v=parseNum(price.value); c.p=(v==null?null:v);
    const l=S.list.find(x=>x.catId===c.id); if(l) l.p=c.p; save(); };
  const eu=document.createElement('span'); eu.className='cfg-eur'; eu.textContent='€';
  const unit=document.createElement('button'); unit.className='cfg-unit'+(c.unit==='kg'?' kg':''); unit.textContent=c.unit==='kg'?'kg':'pièce';
  unit.onclick=()=>{ c.unit=(c.unit==='kg'?'pce':'kg'); const l=S.list.find(x=>x.catId===c.id); if(l) l.unit=c.unit; save(); unit.textContent=c.unit==='kg'?'kg':'pièce'; unit.classList.toggle('kg',c.unit==='kg'); };
  sub.append(price,eu,unit);
  mid.append(name,sub);
  // delete
  const del=document.createElement('button'); del.className='cfg-del'; del.innerHTML='🗑'; del.setAttribute('aria-label','Supprimer');
  del.onclick=()=>{
    if(!confirm('Supprimer « '+(c.n||'cet article')+' » du catalogue ?')) return;
    S.catalog=S.catalog.filter(x=>x.id!==c.id);
    S.list=S.list.filter(l=>l.catId!==c.id);   // drop any list line for it
    save(); renderConfigBody();
  };
  row.append(rk,mid,del);
  return row;
}

/* ---------- inline edits ---------- */
function editPrice(l,span){
  const box=document.createElement('span'); box.className='inlineprice';
  const inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal';
  inp.value=l.p==null?'':String(l.p).replace('.',',');
  const eurS=document.createElement('span'); eurS.textContent='€'; eurS.style.color='var(--ink-faint)'; eurS.style.fontSize='.85rem';
  box.append(inp,eurS); span.replaceWith(box); inp.focus(); inp.select();
  const commit=()=>{const v=parseNum(inp.value); l.p=(v==null?null:v);
    const c=S.catalog.find(c=>c.id===l.catId); if(c) c.p=l.p; save(); render();};
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault(); inp.blur();} if(e.key==='Escape'){render();}};
}
function editQty(l,btn){
  const inp=document.createElement('input'); inp.className='q'; inp.type='text'; inp.inputMode='decimal';
  inp.value=fmtQty(l.qty); inp.style.width='44px';
  btn.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{let v=parseNum(inp.value); if(v==null||v<=0){removeLine(l);} else {l.qty=round(v);} save(); render();};
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault(); inp.blur();} if(e.key==='Escape'){render();}};
}

/* ---------- list ops ---------- */
function toggleUnit(l){
  l.unit=isKg(l)?'pce':'kg';
  const c=S.catalog.find(c=>c.id===l.catId); if(c) c.unit=l.unit;  // remember for next time
  save(); render();
}
function removeLine(l){S.list=S.list.filter(x=>x!==l);}
function bumpUse(cat){ cat.uses=(cat.uses||0)+1; cat.last=Date.now(); cat.tier='fav'; }  // use auto-promotes to Fréquents
function addToList(cat){
  bumpUse(cat);
  let l=S.list.find(x=>x.catId===cat.id);
  if(l){ l.qty=round(l.qty+stepOf(l)); }
  else { l={id:newId(),catId:cat.id,n:cat.n,p:cat.p,note:cat.note||'',unit:cat.unit||'pce',qty:1,checked:false};
    S.list.unshift(l); }
  save();
  return l;
}
function createItem(name,price){
  const cat={id:newId(),n:name.trim(),p:(price==null?null:price),note:'',unit:'pce',uses:0,last:0,tier:'mid'};
  S.catalog.unshift(cat);
  const l=addToList(cat);
  return l;
}

function catRow(c,showUses){
  const inList=S.list.find(l=>l.catId===c.id);
  const row=document.createElement('button'); row.className='res'; row.type='button';
  const pr=c.p==null?'<span class="pr none">prix ?</span>'
    :`<span class="pr">${fmt(c.p)}${c.unit==='kg'?'/kg':''}</span>`;
  row.innerHTML=`<span class="nm"><span class="t">${esc(c.n)}</span>${c.note?'<span class="note">'+esc(c.note)+'</span>':''}</span>
    ${showUses&&c.uses?`<span class="uses">×${c.uses}</span>`:''}
    ${inList?`<span class="inbag">×${fmtQty(inList.qty)}</span>`:''}${pr}`;
  row.onclick=()=>{ addToList(c); afterAdd(); };
  return row;
}
function resHead(txt,fav){
  const d=document.createElement('div'); d.className='res-hd'+(fav?' fav':''); d.textContent=txt; return d;
}
function renderResults(){
  const qRaw=search.value.trim(), q=norm(qRaw);
  sbox.classList.toggle('has',qRaw.length>0);
  if(!qRaw){ if(document.activeElement===search) renderBrowse(); else {results.classList.remove('show'); results.innerHTML='';} return; }

  const matches=S.catalog
    .map(c=>({c,i:norm(c.n).indexOf(q)}))
    .filter(o=>o.i>=0)
    .sort((a,b)=>a.i-b.i || a.c.n.length-b.c.n.length)
    .slice(0,40);
  const exact=S.catalog.some(c=>norm(c.n)===q);

  results.innerHTML='';
  if(!exact){
    const row=document.createElement('button'); row.className='res create'; row.type='button';
    row.innerHTML=`<span class="plus">+</span><span class="mk">Créer « ${esc(qRaw)} »<small>ajoute à la liste et au catalogue</small></span>`;
    const mini=document.createElement('span'); mini.className='pricemini';
    const pin=document.createElement('input'); pin.type='text'; pin.inputMode='decimal'; pin.placeholder='prix'; pin.setAttribute('aria-label','Prix');
    const eu=document.createElement('span'); eu.className='eur'; eu.textContent='€';
    mini.append(pin,eu);
    pin.onclick=e=>e.stopPropagation();
    pin.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault(); doCreate(qRaw,pin.value);}};
    row.appendChild(mini);
    row.onclick=()=>doCreate(qRaw,pin.value);
    results.appendChild(row);
  }
  for(const {c} of matches) results.appendChild(catRow(c));
  results.classList.add('show');
}
// empty search + focused → browsable catalog: Fréquents on top, then A–Z with sticky letter headers
function renderBrowse(){
  results.innerHTML='';
  const fav=S.catalog.filter(c=>c.uses>0).sort((a,b)=>b.uses-a.uses || b.last-a.last).slice(0,8);
  if(fav.length){
    results.appendChild(resHead('Fréquents',true));
    fav.forEach(c=>results.appendChild(catRow(c,true)));
  }
  const byName=[...S.catalog].sort((a,b)=>norm(a.n).localeCompare(norm(b.n),'fr'));
  let letter='';
  for(const c of byName){
    const ch=norm(c.n).charAt(0); const L=/[a-z]/.test(ch)?ch.toUpperCase():'#';
    if(L!==letter){ letter=L; results.appendChild(resHead(letter,false)); }
    results.appendChild(catRow(c));
  }
  results.classList.add('show');
}
function doCreate(name,priceStr){
  const p=parseNum(priceStr);
  createItem(name,p);
  afterAdd();
}
function afterAdd(){
  search.value=''; renderResults(); render();
  search.focus();
}

/* ---------- input events ---------- */
search.addEventListener('input',renderResults);
search.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const qRaw=search.value.trim(); if(!qRaw) return;
    const q=norm(qRaw);
    const top=S.catalog.map(c=>({c,i:norm(c.n).indexOf(q)})).filter(o=>o.i>=0)
      .sort((a,b)=>a.i-b.i||a.c.n.length-b.c.n.length)[0];
    if(top){ addToList(top.c); afterAdd(); }
    else { const pin=results.querySelector('.create .pricemini input'); if(pin) pin.focus(); }
  }
  if(e.key==='Escape'){search.value=''; renderResults();}
});
$('clr').onclick=()=>{search.value=''; renderResults(); search.focus();};
document.addEventListener('click',e=>{
  if(!e.target.closest('.searchwrap')) results.classList.remove('show');
});
search.addEventListener('focus',renderResults);   // empty → browse, typed → filter

/* ---------- mode + target + theme ---------- */
$('mMaison').onclick=()=>{S.mode='maison'; save(); render();};
$('mMagasin').onclick=()=>{S.mode='magasin'; save(); render();};
$('goalBtn').onclick=()=>{
  const cur=String(S.target).replace('.',',');
  const v=prompt('Plafond ticket resto par jour (€) :',cur);
  if(v!=null){const n=parseNum(v); if(n!=null&&n>0){S.target=n; save(); render();}}
};

function applyTheme(){
  if(S.theme) document.documentElement.setAttribute('data-theme',S.theme);
  else document.documentElement.removeAttribute('data-theme');
}
$('theme').onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark'
    || (!S.theme && matchMedia('(prefers-color-scheme:dark)').matches);
  S.theme=dark?'light':'dark'; save(); applyTheme();
};

/* ---------- sticky shadow ---------- */
const sentinel=document.createElement('div'); sentinel.style.height='1px';
document.body.prepend(sentinel);
new IntersectionObserver(([e])=>{$('top').classList.toggle('stuck',!e.isIntersecting)})
  .observe(sentinel);

/* ---------- export / import (JSON backup — the sync method) ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date().toISOString().slice(0,10);
  a.href=url; a.download=`courses-${d}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const j=JSON.parse(r.result);
        if(!j||!Array.isArray(j.catalog)) throw new Error('format');
        if(!confirm('Remplacer la liste et le catalogue actuels par le fichier importé ?')) return;
        S=migrate(j); save(); render();
        alert('Importé : '+j.catalog.length+' articles.');
      }catch(e){ alert('Fichier invalide : '+e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- utils ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function round(n){return Math.round(n*1000)/1000;}
function fmtQty(q){return Number.isInteger(q)?String(q):String(q).replace('.',',');}

/* ---------- Firebase catalog sync (two-way, catalog only; last-write-wins) ----------
   Catalog (item defs) syncs Mac<->phone via Firestore doc catalogs/main.
   List (S.list) stays per-device. SDK loaded dynamically + gated to the real
   deploy origin so jsdom tests (example.org) never touch the network. App works
   offline from localStorage regardless — sync is a pure enhancement. */
const firebaseConfig={
  apiKey:"AIzaSyAfNjn_A_fys1gJV-3wdkK-t8Enhi4xyDo",
  authDomain:"groceries-d91a9.firebaseapp.com",
  projectId:"groceries-d91a9",
  storageBucket:"groceries-d91a9.firebasestorage.app",
  messagingSenderId:"31871902081",
  appId:"1:31871902081:web:71cddf60d5cde9701d8880"
};
const DEVICE_ID=(()=>{try{let d=localStorage.getItem('courses_device');
  if(!d){d=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('courses_device',d);}
  return d;}catch(e){return 'dev';}})();
let syncCatRef=null, syncReady=false, applyingRemote=false, pushTimer=null;
let lastCatalogJson=JSON.stringify(S.catalog);   // to detect catalog-only changes in save()
let lastKnownTs=0;                                // newest updatedAt seen or written (echo/LWW guard)

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');
  s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(s);});}

async function initSync(){
  if(!/(github\.io|localhost|127\.0\.0\.1)/.test(location.hostname)) return;  // deploy/dev only → tests stay offline
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.5/';
    await loadScript(B+'firebase-app-compat.js');
    await loadScript(B+'firebase-auth-compat.js');
    await loadScript(B+'firebase-firestore-compat.js');
    firebase.initializeApp(firebaseConfig);
    syncCatRef=firebase.firestore().collection('catalogs').doc('main');
    await firebase.auth().signInAnonymously();
    syncReady=true;
    syncCatRef.onSnapshot(applyRemoteCatalog, e=>console.warn('[sync] snapshot',e));
  }catch(e){ console.warn('[sync] disabled:', (e&&e.message)||e); }
}

function applyRemoteCatalog(snap){
  const d=snap.data();
  if(!d||!Array.isArray(d.items)){ pushCatalog(); return; }   // remote empty → seed from this device
  const ts=d.updatedAt||0;
  if(ts<=lastKnownTs) return;                                 // not newer (covers our own echo)
  lastKnownTs=ts;
  applyingRemote=true;
  S.catalog=d.items;
  reconcileList();                                            // re-link list lines after catalog swap
  lastCatalogJson=JSON.stringify(S.catalog);
  save(); render();
  applyingRemote=false;
}

// remote catalog replaced local → relink list lines (id-spaces differ per device): by id, else by name
function reconcileList(){
  const byId=new Map(S.catalog.map(c=>[c.id,c]));
  const byNorm=new Map(S.catalog.map(c=>[norm(c.n),c]));
  for(const l of S.list){
    let c=(l.catId!=null)?byId.get(l.catId):null;
    if(!c) c=byNorm.get(norm(l.n));
    if(c){ l.catId=c.id; l.n=c.n; l.p=c.p; l.unit=c.unit; }
  }
}

function pushCatalog(){
  if(!syncReady||!syncCatRef) return;
  const ts=Date.now(); lastKnownTs=ts;
  syncCatRef.set({items:S.catalog, updatedAt:ts, updatedBy:DEVICE_ID})
    .catch(e=>console.warn('[sync] push',e));
}

// from save(): push only when catalog actually changed (skip list-only saves), debounced
function syncOnSave(){
  if(applyingRemote||!syncReady) return;
  const j=JSON.stringify(S.catalog);
  if(j===lastCatalogJson) return;
  lastCatalogJson=j;
  clearTimeout(pushTimer); pushTimer=setTimeout(pushCatalog,1200);
}

/* ---------- boot ---------- */
function render(){renderHeader(); renderList();}
applyTheme();
render();
initSync();

/* ---------- service worker: offline after first load (needs https/localhost) ---------- */
if('serviceWorker' in navigator){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
